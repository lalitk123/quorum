id: G5
title: Add a user search endpoint (parameterized)
description: >
  Add an endpoint that looks up users by a name query and returns matching rows.
label: approve
note: >
  Clean control, deliberately paired with the SQL-injection case (B1): the query
  LOOKS like the injection case but binds the untrusted value as a parameter
  (placeholder `?`), so it is safe. Approving is correct; a seat that pattern-
  matches "SQL + user input -> reject" without reading the placeholder will
  false-reject here — this case measures that specificity directly.
