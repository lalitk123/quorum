id: G6
title: Add a host-reachability (ping) helper (safe)
description: >
  Add a helper that pings a validated host and returns whether it is reachable.
label: approve
note: >
  Clean control, paired with the command-injection case (B4): it validates the
  host against a strict allowlist pattern and passes an argument LIST to
  subprocess (no shell=True), so no shell metacharacters are interpreted — safe.
  Approving is correct; a seat that pattern-matches "subprocess + user input ->
  reject" without noticing the list form and validation will false-reject.
