# Path to the git repository the agent team works on.
# Can be any local clone with an `origin` remote (needed for push/PR).
repo_path: /path/to/target/repo
base_branch: main

# Parallelism and review policy
max_concurrent_workers: 3
max_review_rounds: 2          # council rejections tolerated per checkpoint before escalating
plan_approval: majority        # majority | unanimous
push_approval: unanimous       # majority | unanimous

# Early-exit voting (worker gates only): cancel reviewer sessions still in flight
# the moment the outcome is forced — a single reject on a unanimous gate, or a
# reached majority on the plan gate. The decision is identical to a full run; it
# only saves the tokens of votes that couldn't change it, at the cost of fewer
# collected objections per round (so a rejected round may fix less per revision).
early_exit_voting: true

# Models (Agent SDK aliases or full model IDs)
worker_model: opus
council_model: sonnet

# Per-seat routing for the council (seats: architect, security, qa, product,
# adversary). A heterogeneous jury of disjoint model families decorrelates
# reviewer errors — the highest-leverage reliability lever. Each seat value is
# either a bare Claude model string, or a backend spec.
#
# Active split: a Claude+OpenAI cross-family jury.
#   - architect, qa, adversary -> inherit council_model (Claude sonnet, your Pro
#                            login). The adversary was on opus for a stronger
#                            red-team, but sonnet is the cost/quality default;
#                            promote it back to opus if you want more teeth.
#   - security, product   -> OpenAI (billed to your OpenAI credits) — disjoint
#                            family, so their errors decorrelate from the Claude seats
# Requires `export OPENAI_API_KEY=…`. The openai backend has no live file tools;
# those seats judge the diff + plan already in the review prompt.
#
# model gpt-5.1 is confirmed available on this account. No `temperature` is set:
# the GPT-5 reasoning models reject any non-default temperature (HTTP 400), so we
# let each seat use its own default. The per-Mtok prices below are approximate —
# update them from OpenAI's pricing page if you want the per_ticket/per_run USD
# caps to track OpenAI spend precisely (your Claude subscription reports ~$0, so
# the caps effectively bound the OpenAI seats only).
council_models:
  adversary: sonnet
  security:
    backend: openai
    model: gpt-5.1
    api_key_env: OPENAI_API_KEY        # base_url defaults to https://api.openai.com/v1
    input_price_per_mtok: 1.25         # approximate — confirm on OpenAI's pricing page
    output_price_per_mtok: 10.0        # approximate — confirm on OpenAI's pricing page
  product:
    backend: openai
    model: gpt-5.1
    api_key_env: OPENAI_API_KEY
    input_price_per_mtok: 1.25         # approximate — confirm on OpenAI's pricing page
    output_price_per_mtok: 10.0        # approximate — confirm on OpenAI's pricing page
#
# For an OpenRouter-fronted jury instead (GPT / Gemini / DeepSeek / Qwen via one
# key), set base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY,
# and model: e.g. openai/gpt-5.1 or google/gemini-3-pro.

# Deterministic gate: commands that must exit 0 in the worktree before the
# council reviews a diff. Failures are fed straight back to the worker.
checks: []
#  - pytest -q
#  - ruff check .

# Clean-sandbox test verification: after the checks pass, re-run the worker's
# COMMITTED tests in a fresh git worktree (no worker residue) to catch tests that
# only pass because of local state, plus a lightweight "teeth" check that reverts
# the change's source and confirms its new tests then fail (vacuous/gamed tests
# are flagged to the council). `test_command` must exit non-zero when tests fail.
verify:
  enabled: false
  test_command: pytest -q

# Hard cost ceilings (USD), tracked from real per-session API cost. A tripped
# budget escalates fail-closed and preserves the worktree. Omit a key = no cap.
budget:
  per_ticket_usd: 10
  per_run_usd: 100

# Canary diffs — verify the verifier. Periodically slip a known-bad gold case
# into the LIVE review stream and alert if the council approves it (a seeded
# defect that would have shipped) or if too few seats dissented (drift warning).
# Catches sycophancy / model drift that a one-time benchmark can't. Each canary
# is one extra council review, charged to the run budget.
canary:
  enabled: false
  gold_dir: bench/gold         # bad cases (label: reject) are reused as canaries
  sample_every: 5              # inject one canary per N real diff reviews
  min_dissent: 2               # fewer seats rejecting a known defect => warning
  baseline_floor: 0.75         # a seat that caught this defect >= this rate before but
                               # approves it now is flagged as a seat-specific regression
  baseline_min_n: 3            # min prior observations before a seat has a baseline

# Reviewer-judgment dataset + reliability model. When log_file is set, --bench
# appends one labeled judgment per seat verdict and reports each seat's estimated
# sensitivity/specificity (Beta-Binomial, with credible intervals). The corpus
# grows across runs; `python main.py --reliability` prints the current model.
reliability:
  log_file: .agent_team/judgments.jsonl

# Continuous drift detection (RQ3): a CUSUM over each seat's canary outcomes (read
# from reliability.log_file). A seat that starts approving known-bad canaries trips
# an alarm on its own. `python main.py --drift` exits non-zero if any seat drifts.
drift:
  baseline_miss_rate: 0.05     # p0: a healthy seat rarely misses a known-bad canary
  degraded_miss_rate: 0.5      # p1: the degraded miss rate to catch quickly
  threshold: 4.0               # CUSUM alarm threshold (higher = fewer false alarms)

# Adaptive reviewer selection (RQ2): from measured reliability, recommend the
# minimum-cost council reaching target_detection. `python main.py --select`.
independence:
  slice_by:                    # optional condition key (e.g. bug_type) to slice φ by,
                               # surfacing seat pairs that share a blind spot on one
                               # defect class even if the jury looks decorrelated overall

selection:
  target_detection: 0.95       # required P(the team catches a real defect)
  seat_costs: {}               # optional per-seat USD cost; uniform if omitted
  budget:                      # optional hard cost cap (null = none)
  max_repeats: 1               # >1 lets the selector buy k majority-voted self-
                               # repeats of a flaky-but-cheap seat (priced from its
                               # measured flip rate) instead of one expensive seat

# Backlog source — defaults to autonomous goal mode: a decomposer agent turns
# goal.md into a ticket backlog (council-reviewed) and the team builds it.
backlog:
  source: goal                 # goal | file | github
  goal_file: goal.md
  file: tasks.yaml             # used when source: file
  github_repo: owner/repo      # used when source: github (open issues via `gh`)

# Graduated review strictness by risk (autonomy tiers — merge always stays human).
# Classifies each change's blast radius and adapts the gate + merge recommendation:
#   HIGH  (auth / secrets / crypto / DB migrations / CI-CD / infra / payment):
#         forced to the strictest (unanimous) gate, permanent human merge.
#   LOW   (docs, lockfiles): full council still runs, flagged safe to fast-track a
#         HUMAN merge.
#   MEDIUM (ordinary source): configured gate, standard human merge.
# It can only tighten the gate, never weaken it. Auto-merge is never available.
autonomy:
  enabled: true

# Signed audit receipts: emit an Ed25519-signed, hash-chained receipt for every
# trust-boundary action (a dry-run approval, a push, a PR open). A third party can
# verify the whole log offline with the public key — `python main.py --verify-receipts`
# — proving what the council decided, on which commit, with no receipts removed.
audit:
  enabled: false
  signing_key_file: .agent_team/audit_key.pem   # Ed25519 private key; created (0600) if missing
  receipts_file: .agent_team/receipts.jsonl     # append-only, hash-chained log

# When true, workers stop after council approval — no push, no PR.
# Flip to false once you trust the pipeline.
dry_run: true
