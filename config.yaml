# Path to the git repository the agent team works on.
# Can be any local clone with an `origin` remote (needed for push/PR).
repo_path: /path/to/target/repo
base_branch: main

# Parallelism and review policy
max_concurrent_workers: 3
max_review_rounds: 3          # council rejections tolerated per checkpoint before escalating
plan_approval: majority        # majority | unanimous
push_approval: unanimous       # majority | unanimous

# Models (Agent SDK aliases or full model IDs)
worker_model: opus
council_model: sonnet

# Optional per-seat model routing for the council (seats: architect, security,
# qa, product, adversary). Diversifying seats decorrelates reviewer errors —
# weak-form within Claude tiers today; cross-provider seats are on the roadmap.
council_models: {}
#  adversary: opus
#  security: opus

# Deterministic gate: commands that must exit 0 in the worktree before the
# council reviews a diff. Failures are fed straight back to the worker.
checks: []
#  - pytest -q
#  - ruff check .

# Hard cost ceilings (USD), tracked from real per-session API cost. A tripped
# budget escalates fail-closed and preserves the worktree. Omit a key = no cap.
budget:
  per_ticket_usd: 10
  per_run_usd: 100

# Backlog source — defaults to autonomous goal mode: a decomposer agent turns
# goal.md into a ticket backlog (council-reviewed) and the team builds it.
backlog:
  source: goal                 # goal | file | github
  goal_file: goal.md
  file: tasks.yaml             # used when source: file
  github_repo: owner/repo      # used when source: github (open issues via `gh`)

# When true, workers stop after council approval — no push, no PR.
# Flip to false once you trust the pipeline.
dry_run: true
